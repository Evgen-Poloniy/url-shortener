name: CI Workflow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  test:
    name: Run Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Unit Tests
        run: go test -cover -race -count=1 -v ./internal/... -coverprofile=coverage.out

      - name: Run Integration Tests
        run: go test -race -count=1 -v ./tests/integration/...

      - name: Check Coverage Threshold
        uses: vladopajic/go-test-coverage@v2
        with:
          config: .testcoverage.yml
