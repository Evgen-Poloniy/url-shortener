profile: coverage.out

threshold:
  total: 70

exclude:
  paths:
    - ^cmd
    - ^configs
    - ^docs
    - ^internal/app
    - ^internal/config
    - ^internal/domain
    - ^internal/server
    - ^migrations
    - ^pkg
    - ^tests
    - .*_mocks\.go$
    - ^internal/middleware/cors\.go$
    - ^internal/middleware/sequrity\.go$
    - ^internal/transport/http/router\.go$
    - ^internal/transport/http/v1/router\.go$
